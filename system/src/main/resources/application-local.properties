# Local development: PostgreSQL running on localhost (see docs/local-postgres.md / scripts/init-local-db.sql).
# Override any value with env vars, e.g. DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/returnright}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
