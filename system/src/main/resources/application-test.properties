# Tests: in-memory H2 in PostgreSQL mode. Flyway runs the same migrations as production.
spring.datasource.url=jdbc:h2:mem:returnright;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
app.storage.dir=${java.io.tmpdir}/returnright-test-photos
app.label.secret=test-label-secret
# Tests drive the reconciler explicitly and use a short gateway timeout.
app.refund.reconciler-enabled=false
app.refund.gateway-timeout=500ms
