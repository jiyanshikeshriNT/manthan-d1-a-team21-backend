# Tests: local PostgreSQL (database returnright_test). Flyway runs the same migrations as production;
# a test-only FlywayMigrationStrategy cleans the schema first so reruns start from an empty database.
# Create the databases once with scripts/init-local-db.sql.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/returnright_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:root}
spring.flyway.clean-disabled=false
app.storage.dir=${java.io.tmpdir}/returnright-test-photos
app.label.secret=test-label-secret
# Tests drive the reconciler explicitly and use a short gateway timeout.
app.refund.reconciler-enabled=false
app.refund.gateway-timeout=500ms
