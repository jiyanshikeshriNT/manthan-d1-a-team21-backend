spring.application.name=returnright

# --- Persistence (schema is owned by Flyway; Hibernate only validates) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- API docs ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,prometheus

# --- ReturnRight business settings (bound to shared.AppProperties) ---
app.zone=Asia/Kolkata
app.storage.dir=${APP_STORAGE_DIR:./data/photos}
app.label.secret=${APP_LABEL_SECRET:dev-only-label-secret-change-me}
app.returns.default-window-days=30
app.refund.approval-threshold-paise=1000000
app.flagging.max-requests=3
app.flagging.window-days=30
app.session.max-attempts=5
app.session.attempt-window=1m
app.session.token-ttl=2h
app.seed.random-seed=20261120
app.seed.staff-password=${APP_SEED_STAFF_PASSWORD:ReturnRight#2026}
